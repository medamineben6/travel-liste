<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Lieux de Voyage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-badge">✈️ Notre carnet d’évasion</div>
      <h1>Mes Lieux de Voyage</h1>
      <p>Les endroits que nous voulons visiter et partager</p>
    </div>
  </header>

  <main class="container">
    <section class="form-card">
      <h2 id="form-title">Créer un nouvel endroit</h2>

      <form id="place-form">
        <input type="hidden" id="place-id">

        <label>
          Nom du lieu
          <input id="name" maxlength="120" placeholder="ex : Chefchaouen" required>
        </label>

        <label>
          Courte description / Pourquoi y aller ?
          <textarea id="description" maxlength="500" rows="3"
            placeholder="ex : La ville bleue dans les montagnes du Rif"></textarea>
        </label>

        <label>
          Lien Google Maps (optionnel)
          <input id="google-maps" type="url" maxlength="500"
            placeholder="https://maps.google.com/...">
        </label>

        <div class="form-actions">
          <button class="primary" type="submit" id="submit-button">Créer</button>
          <button class="secondary hidden" type="button" id="cancel-edit">Annuler</button>
        </div>
      </form>

      <p id="message" class="message"></p>
    </section>

    <section class="list-section">
      <div class="list-header">
        <h2>Ma Liste <span id="count"></span></h2>
        <span id="status" class="status">Connexion...</span>
      </div>

      <div id="places" class="places"></div>

      <div id="empty" class="empty hidden">
        Aucun lieu pour le moment.
      </div>
    </section>
  </main>

  <footer>
    <span>Liste collaborative de voyage</span>
    <span id="last-sync"></span>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
